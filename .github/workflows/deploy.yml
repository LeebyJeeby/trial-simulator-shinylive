name: Deploy Shinylive App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinylive
            any::bslib
            any::dplyr
            any::ggplot2
            any::tidyr
            any::purrr
            any::httpuv

      - name: Build Shinylive App
        run: |
          # Create docs folder if not exists (shinylive does it but just in case)
          Rscript -e 'shinylive::export(appdir = "app", destdir = "docs")'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
