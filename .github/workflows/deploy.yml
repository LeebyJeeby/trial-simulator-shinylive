name: Deploy Shinylive App

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

        run: |
          install.packages(c("shiny", "shinylive", "lme4", "bslib", "tidyverse", "tidyr", "purrr", "httpuv"))
        shell: Rscript {0}

      - name: Build Shinylive App
        run: |
          Rscript -e 'shinylive::export(appdir = ".", destdir = "docs")'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
